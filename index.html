const MENU=[

{id:2,n:'Gongura Chicken',d:'Tangy country-style chicken curry',p:280,v:0,e:'🍗'},

{id:4,n:'Natu Kodi Pulusu',d:'Country chicken in tamarind gravy',p:320,v:0,e:'🍲'},
{id:5,n:'Gongura Pappu',d:'Toor dal with sorrel leaves',p:160,v:1,e:'🥣'},
{id:6,n:'Gutti Vankaya Curry',d:'Stuffed brinjal, peanut-sesame masala',p:190,v:1,e:'🍆'},
{id:7,n:'Pesarattu & Upma',d:'Green gram crepe, ginger chutney',p:120,v:1,e:'🥞'},
{id:8,n:'Gongura Pachadi Meal',d:'Rice, ghee and gongura pickle',p:150,v:1,e:'🍚'},
{id:9,n:'Guntur Chicken Biryani',d:'Dum biryani with raita',p:300,v:0,e:'🍛'}];

/* ========================================================
   FIREBASE CLOUD FIRESTORE & LOCAL DATABASE MODULE
   ======================================================== */
const STAFF_DB_KEY = 'guntur_gongura_staff_db';
const FB_CONFIG_KEY = 'guntur_gongura_fb_config';
const INITIAL_STAFF_DB = [
  { email: 'staff@restaurant.com', password: 'password123', name: 'Standard Staff', role: 'Staff', createdAt: '2026-01-01' },
  { email: 'admin@restaurant.com', password: 'admin123', name: 'Restaurant Admin', role: 'Manager', createdAt: '2026-01-01' }
];

let fbDb = null;
let fbAuth = null;
let isFirebaseConnected = false;
let isFirebaseAuthConnected = false;

// Initialize Firebase if configuration is available
function initFirebase() {
  try {
    let cfg = null;
    if(typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY') {
      cfg = FIREBASE_CONFIG;
    } else if(typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY') {
      cfg = firebaseConfig;
    } else {
      const stored = localStorage.getItem(FB_CONFIG_KEY);
      if(stored) cfg = JSON.parse(stored);
    }
    
    if(cfg && cfg.apiKey && cfg.projectId && cfg.apiKey !== 'YOUR_API_KEY') {
      if(!firebase.apps.length) {
        firebase.initializeApp(cfg);
      }
      try {
        fbAuth = firebase.auth();
        isFirebaseAuthConnected = true;
        console.log('✅ Firebase Authentication connected!');
      } catch(authErr) {
        console.warn('Firebase Auth init warning:', authErr);
      }
      try {
        fbDb = firebase.firestore();
        isFirebaseConnected = true;
        setupFirebaseListeners();
        console.log('✅ Firebase Cloud Firestore connected!');
      } catch(dbErr) {
        console.warn('Firebase Firestore init warning:', dbErr);
      }
      return true;
    }
  } catch(e) {
    console.warn('Firebase init error:', e);
  }
  isFirebaseConnected = false;
  isFirebaseAuthConnected = false;
  return false;
}

function setupFirebaseListeners() {
  if(!fbDb) return;
  // Sync staff collection from Firebase in real-time
  fbDb.collection('staff').onSnapshot(snap => {
    if(!snap.empty) {
      const list = snap.docs.map(d => {
        const data = d.data();
        const email = (data.email || d.id || '').toLowerCase();
        return { email, id: email, ...data };
      });
      saveStaffDB(list);
    } else {
      // Seed default staff into Firebase
      INITIAL_STAFF_DB.forEach(u => {
        fbDb.collection('staff').doc(u.email.toLowerCase()).set({ email: u.email, password: u.password, name: u.name, role: u.role, createdAt: u.createdAt }).catch(() => {});
      });
    }
    draw();
  }, err => console.warn('Firestore staff listener note:', err.message));

  // Sync orders from Firebase
  fbDb.collection('orders').onSnapshot(snap => {
    if(!snap.empty) {
      S.orders = snap.docs.map(d => ({ id: +d.id, ...d.data() })).sort((a,b) => b.t - a.t);
      draw();
    }
  }, err => console.warn('Firestore orders listener note:', err.message));

  // Sync calls from Firebase
  fbDb.collection('calls').onSnapshot(snap => {
    if(!snap.empty) {
      S.calls = snap.docs.map(d => ({ id: +d.id, ...d.data() })).sort((a,b) => b.t - a.t);
      draw();
    }
  }, err => console.warn('Firestore calls listener note:', err.message));
}

initFirebase();

function getStaffDB(){
  try {
    const raw = localStorage.getItem(STAFF_DB_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length > 0) {
        return parsed.map(u => {
          const email = (u.email || (u.id && u.id.includes('@') ? u.id : (u.id ? u.id + '@restaurant.com' : 'staff@restaurant.com'))).toLowerCase();
          return {
            ...u,
            email,
            id: email
          };
        });
      }
    }
  } catch(e){}
  saveStaffDB(INITIAL_STAFF_DB);
  return INITIAL_STAFF_DB;
}

function saveStaffDB(list){
  try {
    localStorage.setItem(STAFF_DB_KEY, JSON.stringify(list));
  } catch(e){}
}

async function addStaffMember(email, password, name, role){
  const cleanEmail = email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)){
    return { ok: false, msg: 'Please enter a valid email address!' };
  }
  if(!password || password.trim().length < 6){
    return { ok: false, msg: 'Password must be at least 6 characters (Firebase requirement)!' };
  }
  const db = getStaffDB();
  if(db.some(u => (u.email || u.id || '').toLowerCase() === cleanEmail)){
    return { ok: false, msg: 'Staff email "' + email + '" already exists in database!' };
  }

  const newStaff = {
    email: cleanEmail,
    id: cleanEmail,
    password: password.trim(),
    name: name.trim() || cleanEmail.split('@')[0],
    role: role || 'Staff',
    createdAt: new Date().toISOString().split('T')[0]
  };

  // 1. Store email and password in Firebase Authentication
  if(isFirebaseAuthConnected && typeof firebase !== 'undefined'){
    try {
      let cfg = (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.apiKey) ? FIREBASE_CONFIG : (typeof firebaseConfig !== 'undefined' ? firebaseConfig : null);
      if(!cfg){
        const stored = localStorage.getItem(FB_CONFIG_KEY);
        if(stored) cfg = JSON.parse(stored);
      }
      if(cfg){
        const secApp = firebase.initializeApp(cfg, 'StaffAdd_' + Date.now());
        await secApp.auth().createUserWithEmailAndPassword(cleanEmail, newStaff.password);
        await secApp.delete();
        console.log('✅ Successfully stored user credentials in Firebase Authentication:', cleanEmail);
      }
    } catch(fbAuthErr){
      console.warn('Firebase Auth user registration note:', fbAuthErr.code, fbAuthErr.message);
    }
  }

  // 2. Store profile in Firebase Cloud Firestore
  if(isFirebaseConnected && fbDb){
    try {
      await fbDb.collection('staff').doc(cleanEmail).set({
        email: newStaff.email,
        password: newStaff.password,
        name: newStaff.name,
        role: newStaff.role,
        createdAt: newStaff.createdAt
      });
      console.log('✅ Stored staff profile in Cloud Firestore');
    } catch(err){
      console.warn('Firestore doc save notice:', err.message);
    }
  }

  db.push(newStaff);
  saveStaffDB(db);
  return { ok: true, staff: newStaff };
}

async function updateStaffPassword(email, newPassword){
  const cleanEmail = email.trim().toLowerCase();
  if(!newPassword || newPassword.trim().length < 6){
    return { ok: false, msg: 'Password must be at least 6 characters (Firebase requirement)!' };
  }

  // Update in Firebase Auth if current user
  if(fbAuth && fbAuth.currentUser && (fbAuth.currentUser.email || '').toLowerCase() === cleanEmail){
    try {
      await fbAuth.currentUser.updatePassword(newPassword.trim());
      console.log('✅ Updated password in Firebase Authentication');
    } catch(fbAuthErr){
      console.warn('Firebase Auth password update note:', fbAuthErr.message);
    }
  }

  if(isFirebaseConnected && fbDb){
    try {
      await fbDb.collection('staff').doc(cleanEmail).update({ password: newPassword.trim() });
    } catch(err){
      console.warn('Firestore update note:', err.message);
    }
  }

  const db = getStaffDB();
  const target = db.find(u => (u.email || u.id || '').toLowerCase() === cleanEmail);
  if(!target) return { ok: false, msg: 'Staff account not found' };
  target.password = newPassword.trim();
  saveStaffDB(db);
  return { ok: true };
}

async function deleteStaffMember(email){
  const cleanEmail = email.trim().toLowerCase();
  let db = getStaffDB();
  if(db.length <= 1) return { ok: false, msg: 'Cannot delete the only remaining staff account!' };
  if(me && ((me.email && me.email.toLowerCase() === cleanEmail) || (me.id && me.id.toLowerCase() === cleanEmail))){
    return { ok: false, msg: 'You cannot delete your own logged-in account!' };
  }

  if(isFirebaseConnected && fbDb){
    try {
      await fbDb.collection('staff').doc(cleanEmail).delete();
      return { ok: true };
    } catch(err){
      return { ok: false, msg: 'Firebase error: ' + err.message };
    }
  }

  db = db.filter(u => (u.email || u.id || '').toLowerCase() !== cleanEmail);
  saveStaffDB(db);
  return { ok: true };
}

const WIFI={ssid:'GunturGongura_Guest',pw:'Gongura@2026'};
const HOTEL={logo:'🌿',name:'Guntur Gongura',tagline:'Authentic Andhra flavours, served with a smile',about:'A family-run Andhra kitchen in Guntur, known for gongura dishes and Guntur chilli heat. Scan the QR code on your table to order without waiting.',hours:'Daily 11:00 AM – 11:00 PM',address:'Guntur, Andhra Pradesh',phone:'+91 00000 00000',highlights:[['🌶️','Guntur Spice','Fiery chilli heat in every plate'],['🥬','Gongura Specials','Tangy sorrel-leaf curries'],['☁️','Cloud Database','Real-time orders & multi-staff authentication']]};
const $=s=>document.querySelector(s);
let S={v:0,orders:[],calls:[],ttt:{b:Array(9).fill(''),n:'X',X:null,O:null,w:''}};
let me=null,cart={},tab='menu',filter='all',staffTab='orders',home=!/^#table/.test(location.hash);

function checkTableHash(){
  const m=location.hash.match(/^#table(\d+)$/);
  if(m&&(!me||me.role==='customer')){me={role:'customer',table:+m[1],name:'Table '+m[1]};home=false;tab='menu'}
}
checkTableHash();

/* ---------- sync: room + same-browser tabs + Firebase ---------- */
let room=null;const bc=('BroadcastChannel' in window)?new BroadcastChannel('gg-sync'):null;
function send(t,d){try{bc&&bc.postMessage({t,d})}catch(e){}try{room&&room.emit(t,d)}catch(e){}}
function recv(t,d){
  if(t==='hello'){send('state',S);return}
  if(t==='state'&&d&&d.v>S.v){const o=S;S=d;notify(o,d);draw()}
}
if(bc)bc.onmessage=e=>recv(e.data.t,e.data.d);
(async()=>{try{room=await claude.use('room');if(room){['state','hello'].forEach(t=>room.on(t,m=>recv(t,m&&m.data!==undefined?m.data:m)));room.emit('hello',1)}}catch(e){}})();
send('hello',1);
function commit(){S.v=Date.now();send('state',S);draw()}
function toast(m,c){const t=document.createElement('div');t.className='toast';if(c)t.style.background=c;t.textContent=m;$('#tc').appendChild(t);setTimeout(()=>t.remove(),2200)}
const mins=t=>{const s=Math.floor((Date.now()-t)/1000);return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'};
const rupee=n=>'₹'+n;

/* ---------- header & routing ---------- */
function head(){
  const h=$('#hd');
  if(!me){
    h.innerHTML=`<div class='max-w-5xl mx-auto px-4 py-3 flex items-center justify-between'><h1 class='text-2xl text-gold font-bold'>${HOTEL.logo} ${HOTEL.name}</h1><button class='btn-outline text-xs sm:text-sm' onclick="home=!home;draw()">${home?'Staff Login':'Hotel Home'}</button></div>`;
    return;
  }
  const who=me.role==='customer'?'Table '+me.table:`Staff: ${me.name||me.email||me.id}`;
  let nav='';
  if(me.role==='customer'){
    nav=['menu','cart','track','games'].map(t=>`<button class="tab px-3 py-2 rounded-lg ${tab===t?'on':''}" onclick="tab='${t}';draw()">${{menu:'Menu',cart:'Cart ('+Object.values(cart).reduce((a,b)=>a+b,0)+')',track:'My Order',games:'Wi‑Fi & Games'}[t]}</button>`).join('');
  } else if(me.role==='staff'){
    const nwCount=S.orders.filter(o=>o.s==='new').length+S.calls.filter(c=>!c.done).length;

    const dbCount=getStaffDB().length;
    nav=`<button class="tab px-3 py-2 rounded-lg ${staffTab==='orders'?'on':''}" onclick="staffTab='orders';draw()">🛎️ Orders & Calls ${nwCount?`<span class="ml-1 px-1.5 py-0.5 rounded-full text-xs bg-red-500/30 text-red-300 font-bold">${nwCount}</span>`:''}</button>
         <button class="tab px-3 py-2 rounded-lg ${staffTab==='kitchen'?'on':''}" onclick="staffTab='kitchen';draw()">👨‍🍳 Kitchen ${ktCount?`<span class="ml-1 px-1.5 py-0.5 rounded-full text-xs bg-amber-500/30 text-amber-300 font-bold">${ktCount}</span>`:''}</button>
         <button class="tab px-3 py-2 rounded-lg ${staffTab==='database'?'on':''}" onclick="staffTab='database';draw()">🗄️ Staff Database <span class="ml-1 px-1.5 py-0.5 rounded-full text-xs bg-blue-500/30 text-blue-300 font-bold">${dbCount}</span></button>`;
  }
  h.innerHTML=`<div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2 flex-wrap"><h1 class="text-xl text-gold font-bold">${HOTEL.logo} ${HOTEL.name} <span class="text-sm text-gray-400 font-normal">· ${who}</span></h1><nav class="flex gap-1 text-sm flex-wrap">${nav}<button class="tab px-3 py-2 rounded-lg" onclick="me=null;home=true;if(location.hash)location.hash='';draw()">Logout</button></nav></div>`}

function draw(){head();const a=$('#app');
  if(!me)a.innerHTML=home?homePage():login();
  else if(me.role==='customer')a.innerHTML=customer()+svcBtn();
  else if(me.role==='staff'){
    if(staffTab==='kitchen') a.innerHTML=chef();
    else if(staffTab==='database') a.innerHTML=staffDatabaseView();
    else a.innerHTML=reception();
  }
  else a.innerHTML=reception()}

/* ---------- home, sound & alerts ---------- */
function homePage(){
  const H=HOTEL;
  return `<section class='rounded-3xl p-8 md:p-14 text-center mb-8' style='background:linear-gradient(135deg,#16213e,#0f3460)'><div class='text-6xl mb-3'>${H.logo}</div><h2 class='text-4xl md:text-5xl font-bold text-gold mb-2'>${H.name}</h2><p class='text-lg text-gray-300 mb-6'>${H.tagline}</p><div class='flex gap-3 justify-center flex-wrap'><button class='btn-gold' onclick="home=false;draw()">Staff Login</button></div></section><div class='grid gap-4 md:grid-cols-3 mb-8'>${H.highlights.map(h=>`<div class='glass rounded-2xl p-5 text-center'><div class='text-3xl mb-2'>${h[0]}</div><h3 class='font-bold mb-1'>${h[1]}</h3><p class='text-sm text-gray-400'>${h[2]}</p></div>`).join('')}</div><div class='grid gap-4 md:grid-cols-2'><div class='glass rounded-2xl p-5'><h3 class='text-xl text-gold font-bold mb-2'>About us</h3><p class='text-sm text-gray-300'>${H.about}</p></div><div class='glass rounded-2xl p-5 text-sm space-y-1'><h3 class='text-xl text-gold font-bold mb-2'>Visit us</h3><p>🕒 ${H.hours}</p><p>📍 ${H.address}</p><p>📞 ${H.phone}</p></div></div>`}

let AC;function beep(n){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.15;o.start(AC.currentTime+i*.25);o.stop(AC.currentTime+i*.25+.15)}}catch(e){}}
function notify(o,n){if(!me)return;const c=(x,f)=>x.filter(f).length;
  if(me.role==='staff'){
    if(c(n.calls,k=>!k.done)>c(o.calls,k=>!k.done)){beep(3);toast('🔔 Table '+n.calls.find(k=>!k.done).table+' needs service!','#ef4444')}
    if(c(n.orders,x=>x.s==='ready')>c(o.orders,x=>x.s==='ready')){beep(2);toast('🍽️ Food ready — send staff to serve','#f59e0b')}
    if(c(n.orders,x=>x.s==='new')>c(o.orders,x=>x.s==='new')){beep(1);toast('📥 New order received')}
    if(c(n.orders,x=>x.s==='accepted')>c(o.orders,x=>x.s==='accepted')){beep(1);toast('👨‍🍳 Order sent to kitchen')}}
  if(me.role==='customer'&&c(n.orders,x=>x.table===me.table&&x.s==='served')>c(o.orders,x=>x.table===me.table&&x.s==='served'))toast('🍽️ Your food is on its way!')}

async function doLogin(){
  const email=($('#staff_email')?.value||'').trim().toLowerCase();
  const pw=($('#staff_pw')?.value||'').trim();
  if(!email)return toast('Please enter Email Address','#ef4444');
  if(!pw)return toast('Please enter Password','#ef4444');

  // 1. Authenticate with Firebase Authentication
  if(fbAuth){
    try {
      const userCred = await fbAuth.signInWithEmailAndPassword(email, pw);
      if(userCred && userCred.user){
        const db = getStaffDB();
        const staffProfile = db.find(u => (u.email || u.id || '').toLowerCase() === email);
        const name = staffProfile?.name || userCred.user.displayName || email.split('@')[0];
        const role = staffProfile?.role || 'Staff';
        beep(0);
        me = { role: 'staff', email: userCred.user.email, id: userCred.user.email, name, title: role };
        staffTab = 'orders';
        toast('Welcome (Firebase Auth), ' + me.name + '!');
        draw();
        return;
      }
    } catch(authErr){
      console.warn('Firebase Auth sign in attempt:', authErr.code, authErr.message);
      // Auto-register in Firebase Auth if account is in local DB
      const db = getStaffDB();
      const localMatch = db.find(u => (u.email || u.id || '').toLowerCase() === email && u.password === pw);
      if(localMatch && (authErr.code === 'auth/user-not-found' || authErr.code === 'auth/invalid-credential' || authErr.code === 'auth/invalid-login-credentials')){
        try {
          const newCred = await fbAuth.createUserWithEmailAndPassword(email, pw);
          if(newCred && newCred.user){
            beep(0);
            me = { role: 'staff', email: newCred.user.email, id: newCred.user.email, name: localMatch.name, title: localMatch.role };
            staffTab = 'orders';
            toast('Welcome! Registered with Firebase: ' + me.name);
            draw();
            return;
          }
        } catch(signupErr){
          console.warn('Firebase auto-signup note:', signupErr);
        }
      }
    }
  }

  // 2. Try Firestore doc
  if(isFirebaseConnected && fbDb){
    try {
      const doc = await fbDb.collection('staff').doc(email).get();
      if(doc.exists && doc.data().password === pw){
        beep(0);
        me={role:'staff', email: doc.data().email || doc.id, id: doc.data().email || doc.id, name: doc.data().name || (doc.data().email || doc.id).split('@')[0], title: doc.data().role || 'Staff'};
        staffTab='orders';
        toast('Welcome, '+me.name+'!');
        draw();
        return;
      }
    } catch(err){}
  }

  // 3. Fallback to local DB
  const db = getStaffDB();
  const staff = db.find(u => (u.email || u.id || '').toLowerCase() === email && u.password === pw);

  if(staff){
    beep(0);
    me={role:'staff', email: staff.email || staff.id, id: staff.email || staff.id, name: staff.name, title: staff.role};
    staffTab='orders';
    toast('Welcome, '+staff.name+'!');
    draw();
  } else {
    beep(2);
    toast('Invalid Email or Password','#ef4444');
  }
}

function saveFirebaseConfig(){
  const raw = ($('#fb_json')?.value||'').trim();
  if(!raw) return toast('Please paste Firebase configuration JSON', '#ef4444');
  try {
    let cfg = null;
    if(raw.startsWith('{') && raw.endsWith('}')) {
      cfg = JSON.parse(raw);
    } else {
      // Handle "const firebaseConfig = { ... };" format
      const match = raw.match(/\{[\s\S]*\}/);
      if(match) cfg = JSON.parse(match[0].replace(/(['"])?([a-zA-Z0-9_]+)(['"])?:/g, '"$2":').replace(/'/g, '"'));
    }
    if(!cfg || !cfg.apiKey || !cfg.projectId) {
      throw new Error('Config missing apiKey or projectId');
    }
    localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
    initFirebase();
    toast('Firebase connected successfully!');
    draw();
  } catch(e) {
    toast('Invalid Firebase JSON format: ' + e.message, '#ef4444');
  }
}

function disconnectFirebase(){
  localStorage.removeItem(FB_CONFIG_KEY);
  isFirebaseConnected = false;
  isFirebaseAuthConnected = false;
  fbDb = null;
  fbAuth = null;
  toast('Disconnected Firebase. Using local database.');

}

/* ---------- kitchen display ---------- */
function chef(){
  const act=S.orders.filter(o=>!['new','ready','served'].includes(o.s)),tables=[...new Set(act.map(o=>o.table))].sort((a,b)=>a-b);
  return `<h2 class="text-3xl font-bold mb-4">Kitchen Display</h2>${tables.length?'<div class="grid gap-4 md:grid-cols-2">':'<p class="text-gray-400">No active tickets.</p>'}${tables.map(t=>{const os=act.filter(o=>o.table===t);return `<div class="glass-gold rounded-2xl p-4"><h3 class="text-xl font-bold text-gold mb-2">Table ${t}</h3>${os.map(o=>{const late=Date.now()-o.t>15*60000;return `<div class="glass rounded-xl p-3 mb-2"><div class="flex justify-between text-sm"><b>#${o.id}</b><span style="color:${late?'#ef4444':'#22c55e'}">⏱ ${mins(o.t)}</span></div><ul class="my-2 text-sm">${o.items.map(x=>`<li>${x.q} × ${x.n}</li>`).join('')}</ul>${o.s==='accepted'?`<button class="btn-gold" style="padding:6px 16px" onclick="setS(${o.id},'cooking')">Start cooking</button>`:`<button class="btn-success" onclick="setS(${o.id},'ready')">✅ Ready to serve — alert staff</button>`}</div>`}).join('')}</div>`}).join('')}${tables.length?'</div>':''}`}

draw();
setInterval(()=>{if(me&&(me.role==='staff'||tab==='track'))draw()},1000);
addEventListener('hashchange',()=>{checkTableHash();if(!me)draw()});
</script>
</body>
</html>
